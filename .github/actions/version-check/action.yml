name: version-check
description: Ensure pyproject.toml version is incremented against base branch
inputs:
  base-ref:
    description: Base branch to compare against
    required: true
runs:
  using: composite
  steps:
    - name: Validate version bump
      shell: bash
      run: |
        set -euo pipefail

        BASE_REF="${{ inputs.base-ref }}"
        CURRENT_FILE="pyproject.toml"

        if [[ ! -f "${CURRENT_FILE}" ]]; then
          echo "Missing ${CURRENT_FILE}" >&2
          exit 1
        fi

        CURRENT_VERSION="$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' "${CURRENT_FILE}" | head -n1 | sed -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/')"
        if [[ -z "${CURRENT_VERSION}" ]]; then
          echo "Could not parse semantic version from ${CURRENT_FILE}" >&2
          exit 1
        fi

        git fetch --no-tags --depth=1 origin "${BASE_REF}"
        BASE_CONTENT="$(git show "origin/${BASE_REF}:pyproject.toml" 2>/dev/null || true)"
        BASE_VERSION="$(printf '%s\n' "${BASE_CONTENT}" | grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' | head -n1 | sed -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/' || true)"
        if [[ -z "${BASE_VERSION}" ]]; then
          BASE_VERSION="0.0.0"
          echo "No base version found on ${BASE_REF}; defaulting to ${BASE_VERSION}"
        fi

        IFS='.' read -r cur_major cur_minor cur_patch <<< "${CURRENT_VERSION}"
        IFS='.' read -r base_major base_minor base_patch <<< "${BASE_VERSION}"

        if (( cur_major < base_major )) || \
           (( cur_major == base_major && cur_minor < base_minor )) || \
           (( cur_major == base_major && cur_minor == base_minor && cur_patch <= base_patch )); then
          echo "Version must be incremented: current=${CURRENT_VERSION}, base=${BASE_VERSION}" >&2
          exit 1
        fi

        echo "Version check passed: ${BASE_VERSION} -> ${CURRENT_VERSION}"
