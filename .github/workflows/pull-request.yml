name: pull-request

on:
  pull_request:
    branches:
      - dev
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version bump
        uses: ./.github/actions/version-check
        with:
          base-ref: ${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: ./install-deps.sh

      - name: Run tests
        run: ./run-tests.sh

  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: ./install-deps.sh

      - name: Run format and lint checks
        run: ./run-format-check.sh
