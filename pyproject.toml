[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-reports-app"
version = "0.1.1"
description = "Slack bot that helps automate expense reports in Unanet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "slack-bolt>=1.22.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["src", "src.unanet", "src.slack", "src.ai"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
